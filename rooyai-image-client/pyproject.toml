[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rooyai-client"
version = "0.1.0"
description = "عميل بايثون وواجهة سطر أوامر لـ Rooyai Image Generation API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
rooyai = "rooyai_client.cli:main"

[tool.setuptools]
packages = ["rooyai_client"]

[tool.setuptools.package-data]
rooyai_client = ["models.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
